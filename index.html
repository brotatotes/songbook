:root {
  --paper: #fbf8f1;
  --ink: #22201c;
  --quiet: #6b645a;
  --line: #e4ddcf;
  --chord: #9a3b1f;
  --accent: #9a3b1f;
  --field: #fffdf8;
  --focus: #7a4b12;
  --size: 1.15rem;
  --serif: "CE Figures", "EB Garamond", "CE Accidentals", Garamond, Baskerville, "Times New Roman", serif;
  --mono: "DejaVu Sans Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root.dark {
  --paper: #1a1917;
  --ink: #e8e2d4;
  --quiet: #a59d8e;
  --line: #34312c;
  --chord: #e2b061;
  --accent: #e2b061;
  --field: #22211e;
  --focus: #e2b061;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.125rem;
  line-height: 1.5;
  font-variant-numeric: lining-nums;
}
a { color: inherit; text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
button, input, textarea, select { font: inherit; color: inherit; }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 0.5rem; top: 0.5rem; background: var(--paper); padding: 0.3rem 0.6rem; z-index: 10; }

.top {
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  max-width: 46rem; margin: 0 auto; padding: 1.1rem 1.25rem 0.4rem;
}
.brand { font-size: 1.35rem; text-decoration: none; letter-spacing: 0.01em; }
.nav { display: flex; gap: 1.1rem; font-size: 1rem; }
.nav a { text-decoration: none; color: var(--quiet); padding: 0.2rem 0; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--ink); text-decoration: underline; }
.count { margin-left: 0.3em; }
main { max-width: 46rem; margin: 0 auto; padding: 0.5rem 1.25rem 4rem; outline: none; }
main.wide { max-width: 72rem; }

h1 { font-weight: 400; font-size: 1.9rem; line-height: 1.2; margin: 1rem 0 0.15rem; }
h2 { font-weight: 400; font-size: 1.3rem; margin: 1.8rem 0 0.4rem; }
.sub { color: var(--quiet); margin: 0; }
.muted { color: var(--quiet); }
.small { font-size: 0.95rem; }

input[type="search"], input[type="text"], input[type="password"], textarea, select {
  background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.65rem; width: 100%;
}
input:focus, textarea:focus, select:focus { border-color: var(--quiet); }
.btn {
  background: none; border: 1px solid var(--line); border-radius: 6px; padding: 0.3rem 0.75rem; cursor: pointer;
  min-height: 2.25rem; line-height: 1.3;
}
.btn:hover { border-color: var(--quiet); }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.btn.link { border: none; padding: 0.3rem 0.2rem; text-decoration: underline; color: var(--quiet); }
.btn[disabled] { opacity: 0.45; cursor: default; }

/* Library */
.search { margin: 0.9rem 0 0.6rem; }
.songs { list-style: none; margin: 0; padding: 0; }
.songs li { border-bottom: 1px solid var(--line); }
.songs a { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 0.7rem 0.1rem; text-decoration: none; }
.songs a:hover .t { text-decoration: underline; }
.songs .a { color: var(--quiet); font-size: 1rem; text-align: right; }
.songs .tag { color: var(--accent); font-size: 0.9rem; margin-left: 0.5em; }
.songs .hit { display: block; color: var(--quiet); font-size: 0.95rem; font-style: italic; }
.empty { color: var(--quiet); padding: 2rem 0; }
.syncline { color: var(--quiet); font-size: 0.95rem; margin-top: 1.5rem; }

/* Song view */
.songhead { margin-bottom: 0.4rem; }
.tools {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 1.1rem;
  padding: 0.55rem 0; margin: 0.6rem 0 1.2rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-size: 1rem;
}
.tool { display: inline-flex; align-items: center; gap: 0.15rem; }
.tool .lbl { color: var(--quiet); margin-right: 0.25rem; }
.tool .val { min-width: 2.6em; text-align: center; }
.step { background: none; border: none; cursor: pointer; min-width: 2.1rem; min-height: 2.1rem; border-radius: 6px; font-size: 1.1rem; line-height: 1; }
.step:hover { background: var(--line); }
.tools .right { margin-left: auto; display: inline-flex; align-items: center; gap: 0.9rem; }
.tools .right .btn.link { text-decoration: none; color: var(--quiet); padding: 0.3rem 0; min-height: 2.1rem; display: inline-flex; align-items: center; }
.tools .right .btn.link:hover { color: var(--ink); text-decoration: underline; }
.summary:empty { display: none; }
.summary { margin: -0.6rem 0 1rem; }

.sheetbody { font-size: var(--size); line-height: 1.35; }
.sec { margin: 0 0 1.25em; break-inside: avoid; }
.sec-label { font-variant: small-caps; letter-spacing: 0.06em; color: var(--quiet); font-size: 0.9em; margin-bottom: 0.15em; text-transform: lowercase; }
.ln { margin: 0 0 0.2em; }
.ln.has-chords { margin-bottom: 0.35em; }
.sg { display: inline-block; vertical-align: bottom; white-space: pre; }
.sg .c { display: block; position: relative; height: 1.25em; font-size: 0.9em; font-weight: 700; color: var(--chord); line-height: 1.25; }
.sg .c { pointer-events: none; }
.sg .c > * { position: absolute; left: 0; bottom: 0; white-space: nowrap; pointer-events: auto; z-index: 1; }
.ln:not(.has-chords) .sg .c, .wd.nc .sg .c { display: none; }
.sg .w { display: block; }
.c button, button.ch {
  all: unset; cursor: pointer; border-radius: 3px;
}
.c button:focus-visible, button.ch:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.c button:hover, button.ch:hover { text-decoration: underline; }
.chordrow { color: var(--chord); font-weight: 700; font-size: 0.9em; white-space: pre-wrap; margin: 0 0 0.35em; }
.chordrow .mark { color: var(--quiet); font-weight: 400; }
.tab { font-family: var(--mono); font-size: 0.78em; line-height: 1.35; white-space: pre; overflow-x: auto; margin: 0.2em 0 0.6em; padding: 0.2em 0; }
.cmt { color: var(--quiet); font-style: italic; margin: 0.2em 0 0.4em; }
.blank { height: 0.7em; }

/* Add / edit */
.editor { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
.fields { display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 0.6rem; margin: 0.8rem 0; }
.fields label, .field label { display: block; font-size: 0.95rem; color: var(--quiet); margin-bottom: 0.15rem; }
.paste { min-height: 26rem; font-family: var(--mono); font-size: 0.85rem; line-height: 1.4; resize: vertical; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
.preview { border-left: 1px solid var(--line); padding-left: 1.5rem; min-height: 10rem; }
.preview .sheetbody { font-size: 1.05rem; }
.hint { color: var(--quiet); font-size: 0.9rem; }
.actions { display: flex; gap: 0.6rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
.actions .danger { margin-left: auto; color: var(--quiet); }

/* To add */
.todoadd { display: grid; grid-template-columns: 2fr 2fr auto; gap: 0.5rem; margin: 0.8rem 0; }
.todos { list-style: none; margin: 0; padding: 0; }
.todos li { display: grid; grid-template-columns: auto 1fr auto; gap: 0.2rem 0.7rem; align-items: baseline; padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.todos input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); }
.todos .done .tt { text-decoration: line-through; color: var(--quiet); }
.todos .links { grid-column: 2 / 4; font-size: 0.95rem; display: flex; gap: 1rem; flex-wrap: wrap; }
.todos .links a { color: var(--quiet); }
.todos .del { color: var(--quiet); }

/* Sync */
.steps { padding-left: 1.3rem; }
.steps li { margin: 0.35rem 0; }
.field { margin: 0.8rem 0; }
.status { padding: 0.6rem 0.8rem; border: 1px solid var(--line); border-radius: 6px; margin: 1rem 0; }

/* Chord diagram sheet */
.sheet-back { position: fixed; inset: 0; background: rgba(20, 18, 15, 0.3); z-index: 20; }
:root.dark .sheet-back { background: rgba(0, 0, 0, 0.6); }
:root.dark .sheet { background: #24221f; border-color: #45413a; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
.sheet {
  position: fixed; z-index: 21; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
  width: min(22rem, calc(100vw - 1.5rem)); background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); padding: 0.8rem 1rem 1rem;
  animation: fade 120ms ease-out;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet .hd { display: flex; justify-content: space-between; align-items: baseline; }
.sheet .nm { font-size: 1.5rem; color: var(--chord); font-weight: 700; }
.sheet .tabs { display: flex; gap: 0.3rem; margin: 0.3rem 0 0.4rem; }
.sheet .tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.sheet svg { display: block; margin: 0 auto; max-width: 100%; }
.sheet .nav2 { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; color: var(--quiet); }
.sheet .notes { text-align: center; color: var(--quiet); font-size: 0.95rem; margin-top: 0.2rem; }

.toast {
  position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); background: var(--paper); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  padding: 0.45rem 0.9rem; border-radius: 6px; font-size: 0.95rem; opacity: 0; pointer-events: none; transition: opacity 150ms; z-index: 30; max-width: calc(100vw - 2rem);
}
.toast.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .toast { transition: none; } }

@media (max-width: 760px) {
  .editor { grid-template-columns: 1fr; }
  .preview { border-left: none; padding-left: 0; border-top: 1px solid var(--line); padding-top: 0.8rem; }
  .paste { min-height: 14rem; }
  .fields { grid-template-columns: 1fr 1fr; }
  .fields .k { grid-column: 1 / 3; }
}
@media (max-width: 520px) {
  body { font-size: 1.0625rem; }
  .top { padding: 0.8rem 1rem 0.2rem; }
  .nav { gap: 0.8rem; font-size: 0.98rem; }
  main { padding: 0.3rem 1rem 3rem; }
  h1 { font-size: 1.6rem; }
  .tools { gap: 0.2rem 0.6rem; }
  .tool .lbl { font-size: 0.9rem; margin-right: 0; }
  .step { min-width: 1.9rem; }
  .tool .val { min-width: 2.1em; }
  .tools .right { margin-left: auto; gap: 1rem; }
  .step { min-width: 2.6rem; min-height: 2.6rem; }
  .sheet { left: 0; right: 0; bottom: 0; transform: none; width: 100%; border-radius: 12px 12px 0 0; border-bottom: none; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
  .todoadd { grid-template-columns: 1fr 1fr; }

}

@media print {
  :root, :root.dark { --paper: #fff; --ink: #000; --quiet: #444; --chord: #000; --line: #ccc; }
  .top, .tools, .skip, .toast, .sheet, .sheet-back, .noprint { display: none !important; }
  body { font-size: 11pt; }
  main { max-width: none; padding: 0; }
  h1 { margin-top: 0; font-size: 18pt; }
  .sheetbody { font-size: 11.5pt; }
  .sheetbody.long { column-count: 2; column-gap: 2.2em; }
  .c button { color: #000; }
  @page { margin: 14mm; }
}
.wd { display: inline-block; white-space: nowrap; vertical-align: bottom; }
.sr-only { position: absolute; left: -999px; width: 1px; height: 1px; overflow: hidden; }
.field input { width: 100%; max-width: 32rem; }

/* Touch screens: comfortable tap targets for the song tools */
@media (pointer: coarse) {
  .step { min-width: 2.75rem; min-height: 2.75rem; }
  .tools .right .btn.link { min-height: 2.75rem; padding: 0 0.35rem; }
}

<script>
/* Copied from Chord Explorer (https://github.com/brotatotes/chord-explorer), src/theory.js, by the same author. Unmodified engine code reused by Songbook. */
/* Chord Explorer music theory engine. Pure JS, no DOM. Works in node (CommonJS) and in the browser (global Theory). */
(function (global) {
  'use strict';

  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const NATURAL_PC = [0, 2, 4, 5, 7, 9, 11];
  const mod = (n, m) => ((n % m) + m) % m;

  // ---------- notes ----------
  function parseNote(s) {
    if (typeof s !== 'string') return null;
    const m = /^([A-Ga-g])(##|bb|x|#|b|♯♯|♭♭|♯|♭|𝄪|𝄫)?$/.exec(s.trim());
    if (!m) return null;
    const letter = LETTERS.indexOf(m[1].toUpperCase());
    const accMap = { '#': 1, '♯': 1, 'b': -1, '♭': -1, '##': 2, 'x': 2, '♯♯': 2, '𝄪': 2, 'bb': -2, '♭♭': -2, '𝄫': -2 };
    const acc = m[2] ? accMap[m[2]] : 0;
    return { letter, acc };
  }
  const notePc = (n) => mod(NATURAL_PC[n.letter] + n.acc, 12);
  function noteName(n, opts) {
    const fancy = opts && opts.unicode;
    const a = n.acc;
    let acc = '';
    if (a > 0) acc = fancy ? (a === 2 ? '𝄪' : '♯'.repeat(a)) : (a === 2 ? '##' : '#'.repeat(a));
    if (a < 0) acc = fancy ? (a === -2 ? '𝄫' : '♭'.repeat(-a)) : 'b'.repeat(-a);
    return LETTERS[n.letter] + acc;
  }

  // ---------- intervals ----------
  // An interval is { num: 1..13, semis }. Degree steps = num-1.
  const BASE_SEMIS = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11, 8: 12, 9: 14, 10: 16, 11: 17, 12: 19, 13: 21 };
  function iv(token) {
    const m = /^(bb|b|#|##)?(\d+)$/.exec(token);
    if (!m) throw new Error('bad interval ' + token);
    const num = +m[2];
    const adj = { bb: -2, b: -1, '#': 1, '##': 2 }[m[1] || ''] || 0;
    return { num, semis: BASE_SEMIS[num] + adj, token };
  }
  const PERFECT = new Set([1, 4, 5, 8, 11, 12]);
  function intervalName(semis, num) {
    // full name like "minor 3rd" from a numbered interval
    const base = BASE_SEMIS[num];
    const d = semis - base;
    const ord = ordinal(num);
    if (PERFECT.has(num)) {
      return ({ '-2': 'doubly diminished', '-1': 'diminished', '0': 'perfect', '1': 'augmented', '2': 'doubly augmented' }[d] || '?') + ' ' + ord;
    }
    return ({ '-2': 'diminished', '-1': 'minor', '0': 'major', '1': 'augmented' }[d] || '?') + ' ' + ord;
  }
  function ordinal(n) {
    if (n === 1) return 'unison';
    if (n === 8) return 'octave';
    const s = (n % 10 === 1 && n !== 11) ? 'st' : (n % 10 === 2 && n !== 12) ? 'nd' : (n % 10 === 3 && n !== 13) ? 'rd' : 'th';
    return n + s;
  }
  // Interval between two spelled notes, ascending within an octave.
  function intervalBetween(a, b) {
    const steps = mod(b.letter - a.letter, 7);
    const semis = mod(notePc(b) - notePc(a), 12);
    const num = steps + 1;
    let s = semis;
    const base = BASE_SEMIS[num];
    if (s - base > 6) s -= 12; else if (base - s > 6) s += 12;
    return { num, semis: s, name: intervalName(s, num) };
  }
  const SIMPLE_INTERVAL_NAMES = ['unison', 'minor 2nd', 'major 2nd', 'minor 3rd', 'major 3rd', 'perfect 4th', 'tritone', 'perfect 5th', 'minor 6th', 'major 6th', 'minor 7th', 'major 7th'];

  function transpose(note, interval) {
    const letter = mod(note.letter + interval.num - 1, 7);
    const target = notePc(note) + interval.semis;
    let acc = mod(target - NATURAL_PC[letter], 12);
    if (acc > 6) acc -= 12;
    return { letter, acc };
  }

  // ---------- chord symbols ----------
  function normalizeSymbol(s) {
    return s.replace(/^\s*([A-Ga-g])\s*-?\s*(sharp|flat)\b/i, (m, l, a) => l + (a.toLowerCase() === 'sharp' ? '#' : 'b'))
      .replace(/\b(sharp)\s*(?=\d)/gi, '#').replace(/\b(flat)\s*(?=\d)/gi, 'b')
      .replace(/\s*\bover\s+/gi, '/')
      .replace(/half[-\s]?dim(inished)?/gi, 'hdim').replace(/diminished/gi, 'dim').replace(/augmented/gi, 'aug').replace(/dominant\s*/gi, '').replace(/suspended/gi, 'sus')
      .replace(/\s+/g, '')
      .replace(/[△Δ∆](?![0-9])/g, 'maj7')
      .replace(/♯/g, '#').replace(/♭/g, 'b').replace(/[−–]/g, '-')
      .replace(/[△Δ∆]/g, 'maj').replace(/[°º]/g, 'dim').replace(/ø/g, 'hdim');
  }

  function parseChord(input) {
    if (typeof input !== 'string') return null;
    let s = normalizeSymbol(input);
    if (!s) return null;
    // root
    const rm = /^([A-Ga-g])(##|bb|#|b)?/.exec(s);
    if (!rm) return null;
    let rootStr = rm[1].toUpperCase() + (rm[2] || '');
    let rest = s.slice(rm[0].length);
    // A lone 'b' root followed by 'b' could be "Bb"; handled by regex. Guard "Cb5"? treat as C flat 5 (rare); fine.
    let bass = null;
    const sm = /\/([A-Ga-g](?:##|bb|#|b)?)$/.exec(rest);
    if (sm) { bass = parseNote(sm[1][0].toUpperCase() + sm[1].slice(1)); rest = rest.slice(0, sm.index); }
    const root = parseNote(rootStr);
    const c = { third: '3', fifth: '5', seventh: null, sixth: false, exts: [], alts: [], adds: [], sus: null, power: false, quality: 'maj', majSeventh: false, omit: [] };
    let r = rest;
    const eat = (re) => { const m = re.exec(r); if (m) { r = r.slice(m[0].length); return m; } return null; };
    // quality
    if (eat(/^hdim7?/i)) { c.quality = 'hdim'; c.third = 'b3'; c.fifth = 'b5'; c.seventh = 'b7'; }
    else if (eat(/^(maj|Maj|MAJ|ma|Ma|M(?!in|IN))(?=\d|$|\(|add|sus|#|b|\/)/)) { c.majSeventh = true; c.majWord = true; }
    else if (eat(/^(major)/i)) { c.majSeventh = true; c.majWord = true; }
    else if (eat(/^(minor|min|mi|m|-)/)) { c.quality = 'min'; c.third = 'b3'; }
    else if (eat(/^(dim|o)/i)) { c.quality = 'dim'; c.third = 'b3'; c.fifth = 'b5'; }
    else if (eat(/^(aug|\+)/i)) { c.quality = 'aug'; c.fifth = '#5'; }
    if (c.quality === 'min' && eat(/^\(?(maj|Maj|M|ma|Δ)\)?(?=\d|$|\()/)) { c.majSeventh = true; }
    if (c.quality === 'min' && eat(/^\(?(maj|Maj|M|ma)(7|9|11|13)\)?/)) { c.majSeventh = true; r = RegExp.$2 ? r : r; }
    // number
    let m;
    if ((m = eat(/^(6\/9|69)/))) { c.sixth = true; c.exts.push('9'); }
    else if ((m = eat(/^(13|11|9|7|6|5|2|4)/))) {
      const n = m[1];
      if (n === '6') c.sixth = true;
      else if (n === '5') { if (c.quality !== 'maj' || c.majWord) return null; c.power = true; }
      else if (n === '2') { c.sus = '2'; }
      else if (n === '4') { c.sus = '4'; }
      else {
        c.seventh = c.seventh || (c.majSeventh ? '7' : (c.quality === 'dim' ? 'bb7' : 'b7'));
        if (n === '9') c.exts.push('9');
        if (n === '11') c.exts.push('9', '11');
        if (n === '13') { c.exts.push('9'); if (c.quality === 'min') c.exts.push('11'); c.exts.push('13'); }
      }
    }
    if (c.majWord && !c.seventh && !c.sixth) c.majSeventh = false; // "Cmaj" = C major triad
    // modifiers
    let guard = 0;
    while (r.length && guard++ < 20) {
      if (eat(/^[(),]/)) continue;
      if ((m = eat(/^(maj|M)(7|9|11|13)/))) { c.majSeventh = true; c.seventh = '7'; if (m[2] !== '7') { c.exts.push('9'); if (m[2] !== '9') c.exts.push('11'); if (m[2] === '13') c.exts.push('13'); } continue; }
      if ((m = eat(/^sus(2|4)?/i))) { c.sus = m[1] || '4'; continue; }
      if ((m = eat(/^add(b|#)?(2|4|9|11|13)/i))) { c.adds.push((m[1] || '') + m[2]); continue; }
      if ((m = eat(/^(no|omit)(3|5)/i))) { c.omit.push(m[2]); continue; }
      if ((m = eat(/^alt/i))) { c.seventh = c.seventh || 'b7'; c.alts.push('b9', '#9', '#11', 'b13'); c.fifth = null; continue; }
      if ((m = eat(/^(b|#|\+|-)(5|9|11|13)/))) { const a = (m[1] === '+' ? '#' : m[1] === '-' ? 'b' : m[1]) + m[2]; c.alts.push(a); continue; }
      if ((m = eat(/^(7|9|11|13)/)) && c.sixth === false && !c.seventh) { c.seventh = 'b7'; if (m[1] !== '7') c.exts.push('9'); if (m[1] === '11' || m[1] === '13') c.exts.push('11'); if (m[1] === '13') c.exts.push('13'); continue; }
      if (m) continue;
      return null;
    }
    if (r.length) return null;
    // apply sus
    if (c.sus) c.third = c.sus;
    if (c.power) { c.third = null; }
    // alterations
    for (const a of c.alts) {
      const num = a.replace(/[b#]/g, '');
      if (num === '5') c.fifth = a;
      else { const i = c.exts.indexOf(num); if (i >= 0) c.exts.splice(i, 1); if (!c.seventh && (num === '9' || num === '13' || num === '11')) c.seventh = 'b7'; }
    }
    if (c.quality === 'aug' && c.alts.includes('b5')) return null;
    const tokens = ['1'];
    if (c.third && !c.omit.includes('3')) tokens.push(c.third);
    if (c.fifth && !c.omit.includes('5')) tokens.push(c.fifth);
    if (c.sixth) tokens.push('6');
    if (c.seventh) tokens.push(c.seventh);
    for (const e of c.exts) tokens.push(e);
    for (const a of c.alts) if (!a.endsWith('5') || a.length > 2) { if (!a.match(/^[b#]5$/)) tokens.push(a); }
    for (const a of c.adds) tokens.push(a);
    const uniq = [];
    const seen = new Set();
    for (const t of tokens) if (!seen.has(t)) { seen.add(t); uniq.push(t); }
    const intervals = uniq.map(iv).sort((a, b) => a.semis - b.semis);
    const chord = { root, bass, intervals, parts: c };
    chord.notes = intervals.map((i) => transpose(root, i));
    chord.suffix = canonicalSuffix(c);
    chord.symbol = noteName(root) + chord.suffix + (bass ? '/' + noteName(bass) : '');
    return chord;
  }

  function canonicalSuffix(c) {
    let s = '';
    const top = c.exts.includes('13') ? '13' : c.exts.includes('11') ? '11' : c.exts.includes('9') ? '9' : null;
    if (c.power) return '5';
    if (c.quality === 'hdim') s = 'm' + (top || '7') + 'b5';
    else if (c.quality === 'dim') s = c.seventh ? 'dim' + (top || '7') : 'dim';
    else {
      if (c.quality === 'min') s = 'm';
      if (c.sixth) s += c.exts.includes('9') ? '6/9' : '6';
      else if (c.seventh === '7') s += (c.quality === 'min' ? '(maj' + (top || '7') + ')' : 'maj' + (top || '7'));
      else if (c.seventh === 'b7') s += (top || '7');
      if (c.quality === 'aug') s = (c.seventh ? s : '') ? (s + '#5') : 'aug';
    }
    if (c.sus && !(c.sus === '4' && false)) s += 'sus' + c.sus;
    for (const a of c.alts) if (!(c.quality === 'hdim' && a === 'b5')) s += a;
    for (const a of c.adds) s += 'add' + a;
    for (const o of c.omit) s += 'no' + o;
    if (c.quality === 'aug' && c.seventh) s = s.replace(/^aug/, '');
    return s;
  }

  // ---------- naming: notes -> chord ----------
  // Templates: suffix, tones (interval tokens), optional tones, prior (commonness), description.
  const T = (suffix, tones, opt, prior, desc) => ({ suffix, tones: tones.split(' ').map(iv), opt: new Set(opt ? opt.split(' ') : []), prior, desc });
  const TEMPLATES = [
    T('', '1 3 5', '5', 100, 'a major triad: root, major 3rd and perfect 5th. Bright and stable.'),
    T('m', '1 b3 5', '5', 100, 'a minor triad: root, minor 3rd and perfect 5th. Darker than major.'),
    T('dim', '1 b3 b5', '', 88, 'a diminished triad: two stacked minor 3rds. Tense and unstable.'),
    T('aug', '1 3 #5', '', 84, 'an augmented triad: two stacked major 3rds. Dreamy and unresolved.'),
    T('sus4', '1 4 5', '5', 86, 'a suspended chord: the 3rd is replaced by the 4th, so it is neither major nor minor and wants to resolve.'),
    T('sus2', '1 2 5', '5', 85, 'a suspended chord: the 3rd is replaced by the 2nd. Open and airy.'),
    T('5', '1 5', '', 80, 'a power chord: just the root and 5th, with no 3rd, so it is neither major nor minor.'),
    T('6', '1 3 5 6', '5', 86, 'a major triad with an added major 6th. Sweet, vintage sound.'),
    T('m6', '1 b3 5 6', '5', 84, 'a minor triad with an added major 6th.'),
    T('7', '1 3 5 b7', '5', 96, 'a dominant 7th: a major triad plus a minor 7th. Bluesy, and pulls toward the chord a 5th below.'),
    T('maj7', '1 3 5 7', '5', 95, 'a major 7th: a major triad plus a major 7th, a half step below the octave. Soft and jazzy.'),
    T('m7', '1 b3 5 b7', '5', 95, 'a minor 7th: a minor triad plus a minor 7th. Mellow.'),
    T('m(maj7)', '1 b3 5 7', '5', 76, 'a minor triad with a major 7th. Dark and suspenseful.'),
    T('m7b5', '1 b3 b5 b7', '', 88, 'a half-diminished 7th: a diminished triad plus a minor 7th. Often leads to a dominant chord.'),
    T('dim7', '1 b3 b5 bb7', '', 88, 'a diminished 7th: stacked minor 3rds that divide the octave evenly, so any of its four notes can be the root.'),
    T('7#5', '1 3 #5 b7', '', 74, 'an augmented 7th: a dominant 7th with a raised 5th.'),
    T('maj7#5', '1 3 #5 7', '', 70, 'a major 7th with a raised 5th.'),
    T('7b5', '1 3 b5 b7', '', 72, 'a dominant 7th with a lowered 5th.'),
    T('7sus4', '1 4 5 b7', '5', 84, 'a dominant 7th with the 3rd replaced by the 4th.'),
    T('6/9', '1 3 5 6 9', '5', 78, 'a major triad with an added 6th and 9th. Rich and settled.'),
    T('m6/9', '1 b3 5 6 9', '5', 72, 'a minor triad with an added 6th and 9th.'),
    T('add9', '1 3 5 9', '5', 84, 'a major triad with an added 9th (the 2nd an octave up), without a 7th.'),
    T('madd9', '1 b3 5 9', '5', 82, 'a minor triad with an added 9th, without a 7th.'),
    T('add11', '1 3 5 11', '5', 66, 'a major triad with an added 11th (the 4th an octave up).'),
    T('9', '1 3 5 b7 9', '5', 82, 'a dominant 9th: a dominant 7th with a 9th on top.'),
    T('maj9', '1 3 5 7 9', '5', 80, 'a major 9th: a major 7th with a 9th on top.'),
    T('m9', '1 b3 5 b7 9', '5', 80, 'a minor 9th: a minor 7th with a 9th on top.'),
    T('7b9', '1 3 5 b7 b9', '5', 74, 'a dominant 7th with a flat 9th. Very tense.'),
    T('7#9', '1 3 5 b7 #9', '5', 74, 'a dominant 7th with a sharp 9th, the "Hendrix chord".'),
    T('7#11', '1 3 5 b7 #11', '5', 66, 'a dominant 7th with a sharp 11th.'),
    T('maj7#11', '1 3 5 7 #11', '5', 66, 'a major 7th with a sharp 11th. The Lydian sound.'),
    T('9sus4', '1 4 5 b7 9', '5', 72, 'a 9th chord with the 3rd replaced by the 4th.'),
    T('11', '1 3 5 b7 9 11', '3 5 9', 66, 'an 11th chord: stacked 3rds up to the 11th. The 3rd is often left out.'),
    T('m11', '1 b3 5 b7 9 11', '5 9', 70, 'a minor 11th: a minor 7th with the 9th and 11th.'),
    T('13', '1 3 5 b7 9 13', '5 9', 72, 'a dominant 13th: a dominant 7th with the 13th (the 6th an octave up) on top.'),
    T('maj13', '1 3 5 7 9 13', '5 9', 66, 'a major 13th: a major 7th with the 9th and 13th.'),
    T('m13', '1 b3 5 b7 9 11 13', '5 9 11', 64, 'a minor 13th.'),
    T('7b13', '1 3 5 b7 b13', '5', 60, 'a dominant 7th with a flat 13th.'),
  ];
  const TEMPLATE_BY_SUFFIX = Object.fromEntries(TEMPLATES.map((t) => [t.suffix, t]));

  const ROLE_NAMES = { 1: 'root', 2: '2nd', 3: '3rd', 4: '4th', 5: '5th', 6: '6th', 7: '7th', 9: '9th', 11: '11th', 13: '13th' };
  function roleOf(token) {
    const i = iv(token);
    const pre = token.startsWith('bb') ? '♭♭' : token.startsWith('b') ? '♭' : token.startsWith('#') ? '♯' : '';
    if (i.num === 3 || i.num === 7 || i.num === 1) return (token === 'b3' ? 'minor 3rd' : token === '3' ? 'major 3rd' : token === 'b7' ? 'minor 7th' : token === '7' ? 'major 7th' : token === 'bb7' ? 'diminished 7th' : 'root');
    return pre + ROLE_NAMES[i.num];
  }

  // Key context: { tonic: note, mode: 'major'|'minor' }
  function keyScale(key) {
    if (!key) return null;
    return scaleNotes(key.tonic, key.mode === 'minor' ? 'minor' : 'major');
  }

  const SPELL_PREF = { 1: -1, 3: -1, 6: 1, 8: -1, 10: -1 };
  function rootSpellings(pc) {
    const out = [];
    for (let l = 0; l < 7; l++) {
      let acc = mod(pc - NATURAL_PC[l], 12); if (acc > 6) acc -= 12;
      if (Math.abs(acc) <= 1) out.push({ letter: l, acc });
    }
    return out;
  }
  function spellChordRoot(pc, tokens, key) {
    const ks = keyScale(key);
    if (ks) {
      const hit = ks.find((n) => notePc(n) === pc);
      if (hit) return hit;
    }
    const opts = rootSpellings(pc);
    let best = null; let bestScore = Infinity;
    for (const r of opts) {
      const notes = tokens.map((t) => transpose(r, iv(t)));
      let sc = notes.reduce((a, n) => a + Math.abs(n.acc) + (Math.abs(n.acc) > 1 ? 10 : 0), 0) + (Math.abs(r.acc) > 0 && (r.letter === 2 || r.letter === 6 || r.letter === 3 || r.letter === 0) && r.acc !== 0 && NATURAL_PC[r.letter] !== pc ? 0 : 0);
      // avoid E#, B#, Fb, Cb as roots unless forced by key
      if ((r.letter === 2 && r.acc === 1) || (r.letter === 6 && r.acc === 1) || (r.letter === 3 && r.acc === -1) || (r.letter === 0 && r.acc === -1)) sc += 20;
      if (ks) { const keyFlat = ks.some((n) => n.acc < 0); const keySharp = ks.some((n) => n.acc > 0); if (keyFlat && r.acc > 0) sc += 3; if (keySharp && r.acc < 0) sc += 3; }
      else if (sc === bestScore && SPELL_PREF[pc] === r.acc) sc -= 0.5;
      if (!ks && SPELL_PREF[pc] === r.acc) sc -= 0.25;
      if (sc < bestScore) { bestScore = sc; best = r; }
    }
    return best;
  }

  // notes: array of pitch classes or midi numbers; bass: pitch class of lowest sounding note (optional; defaults to first)
  function nameChord(pcsIn, opts) {
    opts = opts || {};
    const pcs = [...new Set(pcsIn.map((p) => mod(p, 12)))];
    if (pcs.length === 0) return { kind: 'empty', candidates: [] };
    const bass = opts.bass != null ? mod(opts.bass, 12) : mod(pcsIn[0], 12);

    const html = words.map((w) => '<span class="wd' + (w.some((pc) => pc.chord) ? '' : ' nc') + '">' + w.map((pc) => '<span class="sg"><span class="c">' + (pc.chord ? chordBtn(pc.chord) : '') +
      '</span><span class="w"' + (pad.has(pc) ? ' style="padding-right:' + (pad.get(pc) * 0.56).toFixed(2) + 'em"' : '') + '>' + (esc(pc.text) || (pc.chord ? '\u00a0' : '')) + '</span></span>').join('') + '</span>').join('');
    return '<div class="ln' + (has ? ' has-chords' : '') + '">' + html + '</div>';
  }
  function renderChordRow(line) {
    let out = ''; let col = 0;
    for (const it of line.items) {
      if (it.col > col) out += ' '.repeat(it.col - col);
      else if (out) out += ' ';
      out += chordBtn(it.tok);
      col = Math.max(it.col, col) + it.tok.length + (it.col < col ? 1 : 0);
    }
    return '<div class="chordrow">' + out + '</div>';
  }
  function renderSong(song) {
    let lines = 0;
    const html = song.sections.map((s) => {
      const out = [];
      let tab = null;
      for (const l of s.lines) {
        lines++;
        if (l.type === 'tab') { if (tab) tab.push(l.text); else { tab = [l.text]; out.push(tab); } continue; }
        tab = null;
        if (l.type === 'lyric') out.push(renderLyric(l));
        else if (l.type === 'chords') out.push(renderChordRow(l));
        else if (l.type === 'comment') out.push('<div class="cmt">' + esc(l.text) + '</div>');
        else if (l.type === 'blank') out.push('<div class="blank"></div>');
      }
      const body = out.map((x) => (Array.isArray(x) ? '<div class="tab">' + esc(x.join('\n')) + '</div>' : x)).join('');
      const label = s.label ? '<div class="sec-label">' + esc(s.label) + '</div>' : '';
      return '<section class="sec">' + label + body + '</section>';
    }).join('');
    return { html, lines };
  }

  function viewSong(path) {
    const song0 = songAt(path);
    if (!song0) { main.innerHTML = '<p class="empty">That song is not in this browser. <a href="#/">Back to the library</a></p>'; return; }
    const prefs = songPrefs(path);
    document.title = (song0.meta.title || 'Song') + ' \u00b7 Songbook';
    const key0 = P.songKey(song0);
    function draw() {
      const shown = prefs.semis - prefs.capo;
      const song = P.transposeSong(song0, prefs.semis);
      const disp = prefs.capo ? P.transposeSong(song0, shown) : song;
      const soundKey = P.songKey(song);
      const shapeKey = P.songKey(disp);
      const r = renderSong(disp);
      let summary = '';
      if (soundKey && !song0.meta.key) summary = 'Key guessed from the chords';
      if (prefs.capo) summary = 'Capo ' + prefs.capo + (shapeKey ? ', shapes in ' + pretty(shapeKey) : '') + (soundKey ? ', sounds in ' + pretty(soundKey) : '');
      const extra = [song0.meta.tempo ? song0.meta.tempo + ' bpm' : '', song0.meta.time || ''].filter(Boolean).join(' \u00b7 ');
      main.innerHTML = '<div class="songhead"><h1>' + esc(song0.meta.title || 'Untitled') + '</h1>' +
        '<p class="sub">' + esc(song0.meta.artist || '') + '</p></div>' +
        '<div class="tools" role="toolbar" aria-label="Song controls">' +
        '<span class="tool"><span class="lbl">Key</span><button class="step" data-act="down" aria-label="Transpose down">\u2212</button><span class="val" aria-live="polite" id="keyval">' + esc(pretty(soundKey || (prefs.semis > 0 ? '+' : '') + prefs.semis)) + '</span><button class="step" data-act="up" aria-label="Transpose up">+</button></span>' +
        '<span class="tool"><span class="lbl">Capo</span><button class="step" data-act="capodown" aria-label="Capo down">\u2212</button><span class="val" id="capoval">' + (prefs.capo || 'off') + '</span><button class="step" data-act="capoup" aria-label="Capo up">+</button></span>' +
        '<span class="tool"><span class="lbl">Size</span><button class="step" data-act="smaller" aria-label="Smaller text">A\u2212</button><button class="step" data-act="bigger" aria-label="Larger text">A+</button></span>' +
        '<span class="right"><button class="btn link" data-act="dark" aria-pressed="' + isDark() + '">' + (isDark() ? 'Light' : 'Dark') + '</button>' +
        '<button class="btn link" data-act="print">Print</button><a class="btn link" href="#/edit/' + encodeURIComponent(path) + '">Edit</a></span></div>' +
        '<p class="sub small summary" id="summary">' + [summary ? esc(summary) : '', extra ? esc(extra) : '', prefs.semis ? '<button class="btn link" data-act="reset">original key ' + esc(pretty(key0 || '')) + '</button>' : ''].filter(Boolean).join(' \u00b7 ') + '</p>' +
        '<div class="sheetbody' + (r.lines > 48 ? ' long' : '') + '" id="sheetbody" style="--size:' + SIZES[sizeIdx()] + 'rem">' + r.html + '</div>';
      sheetKey = shapeKey;
    }
    draw();
    main.onclick = (e) => {
      const b = e.target.closest('[data-act]');
      if (b) {
        const a = b.dataset.act;
        if (a === 'up') prefs.semis = (prefs.semis + 1 + 12) % 12 > 6 ? ((prefs.semis + 1) % 12) - 12 : (prefs.semis + 1) % 12;
        if (a === 'down') prefs.semis = (prefs.semis - 1 + 12) % 12 > 6 ? ((prefs.semis - 1 + 12) % 12) - 12 : (prefs.semis - 1 + 12) % 12;
        if (a === 'reset') prefs.semis = 0;
        if (a === 'capoup') prefs.capo = Math.min(11, prefs.capo + 1);
        if (a === 'capodown') prefs.capo = Math.max(0, prefs.capo - 1);
        if (a === 'smaller') store.setting('size', Math.max(0, sizeIdx() - 1));
        if (a === 'bigger') store.setting('size', Math.min(SIZES.length - 1, sizeIdx() + 1));
        if (a === 'dark') { store.setting('dark', !isDark()); applyTheme(); }
        if (a === 'print') { window.print(); return; }
        setSongPrefs(path, { semis: prefs.semis, capo: prefs.capo });
        const focusAct = a;
        draw();
        const again = main.querySelector('[data-act="' + focusAct + '"]');
        if (again) again.focus();
        return;
      }
      const c = e.target.closest('button.ch');
      if (c) openSheet(c.dataset.chord, c);
    };
  }

  // ---------- chord diagram sheet ----------
  let sheetKey = null; let sheetState = null; let sheetReturn = null;
  function openSheet(sym, from) {
    sheetReturn = from || null;
    const inst = store.setting('inst') || 'guitar';
    sheetState = { sym, inst, idx: 0 };
    drawSheet();
    $('#toast').classList.remove('on');
    $('#sheet').hidden = false; $('#sheetBack').hidden = false;
    const f = $('#sheet button'); if (f) f.focus();
  }
  function closeSheet() {
    const s = $('#sheet'); if (!s || s.hidden) return;
    s.hidden = true; $('#sheetBack').hidden = true;
    if (sheetReturn && document.body.contains(sheetReturn)) sheetReturn.focus();
    sheetReturn = null;
  }
  function drawSheet() {
    const { sym, inst } = sheetState;
    const T = window.Theory; const Sh = window.Shapes;
    let body = ''; let nav = ''; let notes = '';
    const chord = T.parseChord(sym);
    if (!chord) body = '<p class="muted">No diagram for this chord.</p>';
    else if (inst === 'piano') {
      const v = Sh.pianoVoicing(chord);
      body = pianoSvg(v);
      notes = v.map((n) => pretty(n.name)).join(' \u00b7 ');
    } else {
      const shapes = Sh.findShapes(chord, inst, 8);
      if (!shapes.length) body = '<p class="muted">No playable shape found.</p>';
      else {
        const i = Math.min(sheetState.idx, shapes.length - 1);
        const sh = shapes[i];
        body = fretSvg(sh, Sh.INSTRUMENTS[inst].strings.length);
        notes = sh.notes.map((n, k) => (sh.frets[k] < 0 ? '' : pretty(n))).filter(Boolean).join(' \u00b7 ');
        nav = '<div class="nav2"><button class="btn link" data-sh="prev" ' + (i ? '' : 'disabled') + ' aria-label="Previous shape">\u2039 Prev</button><span>' + (i + 1) + ' of ' + shapes.length + (sh.difficulty ? ' \u00b7 ' + esc(sh.difficulty) : '') + '</span><button class="btn link" data-sh="next" ' + (i < shapes.length - 1 ? '' : 'disabled') + ' aria-label="Next shape">Next \u203a</button></div>';
      }
    }
    const tabs = ['guitar', 'ukulele', 'piano'].map((k) => '<button class="btn" data-inst="' + k + '" aria-pressed="' + (k === inst) + '">' + k[0].toUpperCase() + k.slice(1) + '</button>').join('');
    $('#sheet').innerHTML = '<div class="hd"><span class="nm" id="sheetTitle">' + esc(pretty(sym)) + '</span><button class="btn link" data-sh="close">Close</button></div>' +
      '<div class="tabs">' + tabs + '</div>' + body + (notes ? '<div class="notes">' + esc(notes) + '</div>' : '') + nav;
  }
  document.addEventListener('click', (e) => {
    if (e.target.id === 'sheetBack') return closeSheet();
    const s = e.target.closest('#sheet [data-sh], #sheet [data-inst]');
    if (!s) return;
    if (s.dataset.inst) { sheetState.inst = s.dataset.inst; sheetState.idx = 0; store.setting('inst', s.dataset.inst); drawSheet(); $('#sheet [data-inst="' + s.dataset.inst + '"]').focus(); return; }
    const a = s.dataset.sh;
    if (a === 'close') return closeSheet();
    if (a === 'next') sheetState.idx++;
    if (a === 'prev') sheetState.idx = Math.max(0, sheetState.idx - 1);
    drawSheet();
    const again = $('#sheet [data-sh="' + a + '"]:not([disabled])') || $('#sheet [data-sh="close"]'); again.focus();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSheet();
    if (e.key === 'Tab' && !$('#sheet').hidden) { // keep focus inside the sheet
      const f = Array.from($('#sheet').querySelectorAll('button:not([disabled])'));
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });

  function fretSvg(sh, n) {
    const W = 180; const H = 200; const left = 30; const top = 40; const gap = (W - 2 * left + 20) / (n - 1); const fh = 30; const rows = 5;
    const played = sh.frets.filter((f) => f > 0);
    const minF = played.length ? Math.min(...played) : 1;
    const maxF = played.length ? Math.max(...played) : 1;
    const base = maxF <= 5 ? 1 : minF;
    const ink = 'currentColor';
    let s = '<svg viewBox="0 0 ' + (W + 20) + ' ' + H + '" width="200" height="200" role="img" aria-label="Chord shape ' + sh.frets.map((f) => (f < 0 ? 'x' : f)).join(' ') + '" style="color:var(--ink)">';
    const x = (i) => left + i * gap;
    s += base === 1 ? '<rect x="' + x(0) + '" y="' + (top - 4) + '" width="' + (x(n - 1) - x(0)) + '" height="5" fill="' + ink + '"/>' : '<text x="' + (x(0) - 8) + '" y="' + (top + fh * 0.65) + '" font-size="15" text-anchor="end" fill="' + ink + '">' + base + 'fr</text>';
    for (let r = 0; r <= rows; r++) s += '<line x1="' + x(0) + '" x2="' + x(n - 1) + '" y1="' + (top + r * fh) + '" y2="' + (top + r * fh) + '" stroke="' + ink + '" stroke-opacity="0.55"/>';
    for (let i = 0; i < n; i++) s += '<line x1="' + x(i) + '" x2="' + x(i) + '" y1="' + top + '" y2="' + (top + rows * fh) + '" stroke="' + ink + '" stroke-opacity="0.7"/>';
    for (const b of sh.barres || []) {
      const y = top + (b.fret - base + 0.5) * fh;
      s += '<rect x="' + (x(b.from) - 9) + '" y="' + (y - 9) + '" width="' + (x(b.to) - x(b.from) + 18) + '" height="18" rx="9" fill="var(--chord)"/>';
    }
    sh.frets.forEach((f, i) => {
      if (f < 0) s += '<text x="' + x(i) + '" y="' + (top - 12) + '" font-size="15" text-anchor="middle" fill="' + ink + '">\u00d7</text>';
      else if (f === 0) s += '<circle cx="' + x(i) + '" cy="' + (top - 17) + '" r="5.5" fill="none" stroke="' + ink + '" stroke-width="1.4"/>';
      else {
        const y = top + (f - base + 0.5) * fh;
        s += '<circle cx="' + x(i) + '" cy="' + y + '" r="9.5" fill="var(--chord)"/>';
        const fg = sh.fingers && sh.fingers[i];
        if (fg && fg !== 0) s += '<text x="' + x(i) + '" y="' + (y + 4.5) + '" font-size="13" text-anchor="middle" fill="var(--paper)">' + fg + '</text>';
      }
    });
    return s + '</svg>';
  }
  function pianoSvg(v) {
    if (!v.length) return '';
    const lo = Math.floor(Math.min(...v.map((n) => n.midi)) / 12) * 12;
    const hi = lo + 24 + (Math.max(...v.map((n) => n.midi)) >= lo + 24 ? 12 : 0);
    const on = new Set(v.map((n) => n.midi));
    const whites = []; for (let m = lo; m < hi; m++) if ([0, 2, 4, 5, 7, 9, 11].includes(m % 12)) whites.push(m);
    const ww = 240 / whites.length; let s = '<svg viewBox="0 0 244 110" width="260" height="117" role="img" aria-label="Piano voicing">';
    whites.forEach((m, i) => { s += '<rect x="' + (2 + i * ww) + '" y="2" width="' + ww + '" height="100" fill="' + (on.has(m) ? 'var(--chord)' : 'var(--field)') + '" stroke="var(--quiet)"/>'; });
    whites.forEach((m, i) => {
      if ([0, 2, 5, 7, 9].includes(m % 12) && m + 1 < hi) s += '<rect x="' + (2 + (i + 1) * ww - ww * 0.32) + '" y="2" width="' + ww * 0.64 + '" height="62" fill="' + (on.has(m + 1) ? 'var(--chord)' : 'var(--ink)') + '" stroke="var(--quiet)"/>';
    });
    return s + '</svg>';
  }

  // ---------- add / edit ----------
  function viewEdit(path) {
    const existing = path ? store.get(path) : null;
    if (path && !existing) { main.innerHTML = '<p class="empty">That song is not in this browser.</p>'; return; }
    main.classList.add('wide');
    document.title = (path ? 'Edit' : 'Add a song') + ' \u00b7 Songbook';
    const s0 = existing ? songAt(path) : null;
    main.innerHTML = '<h1>' + (path ? 'Edit song' : 'Add a song') + '</h1>' +
      '<p class="sub small">Paste chords over lyrics, or ChordPro. Chords, sections and tabs are picked up as you paste.</p>' +
      '<div class="fields"><div><label for="ft">Title</label><input type="text" id="ft" autocomplete="off"></div>' +
      '<div><label for="fa">Artist</label><input type="text" id="fa" autocomplete="off"></div>' +
      '<div class="k"><label for="fk">Key <span id="kguess" class="hint"></span></label><input type="text" id="fk" autocomplete="off" placeholder="G"></div></div>' +
      '<div class="editor"><div><label for="paste" class="sr-only" style="position:absolute;left:-999px">Song text</label>' +
      '<textarea id="paste" class="paste" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste a song here"></textarea>' +
      '<div class="actions"><button class="btn primary" id="save">Save</button><a class="btn link" href="' + (path ? '#/song/' + encodeURIComponent(path) : '#/') + '">Cancel</a>' +
      (path ? '<button class="btn link danger" id="del">Delete song</button>' : '') + '</div></div>' +
      '<div class="preview" aria-label="Preview"><div class="hint" id="pvhint">Preview</div><div class="sheetbody" id="pv"></div></div></div>';
    const ta = $('#paste'); const ft = $('#ft'); const fa = $('#fa'); const fk = $('#fk');
    const touched = { t: false, a: false, k: false };
    if (existing) { ta.value = existing.text; ft.value = s0.meta.title || ''; fa.value = s0.meta.artist || ''; fk.value = s0.meta.key || ''; touched.t = touched.a = touched.k = true; }
    let last = null;
    function update() {
      const song = P.parseSong(ta.value);
      last = song;
      if (!touched.t) ft.value = song.meta.title || '';
      if (!touched.a) fa.value = song.meta.artist || '';
      if (!touched.k) fk.value = song.meta.key || '';
      $('#kguess').textContent = !fk.value && song.guessedKey ? '(guess: ' + pretty(song.guessedKey) + ')' : '';
      fk.placeholder = song.guessedKey || 'G';
      const r = renderSong(song);
      $('#pv').innerHTML = ta.value.trim() ? r.html : '<p class="muted">Nothing pasted yet.</p>';
    }
    ft.addEventListener('input', () => { touched.t = !!ft.value; });
    fa.addEventListener('input', () => { touched.a = !!fa.value; });
    fk.addEventListener('input', () => { touched.k = !!fk.value; update(); });
    ta.addEventListener('input', update);
    update();
    $('#pv').addEventListener('click', (e) => { const c = e.target.closest('button.ch'); if (c) openSheet(c.dataset.chord, c); });
    $('#save').addEventListener('click', () => {
      if (!ta.value.trim()) { toast('Paste a song first.'); ta.focus(); return; }
      const song = last || P.parseSong(ta.value);
      song.meta.title = ft.value.trim() || song.meta.title || 'Untitled';
      song.meta.artist = fa.value.trim() || '';
      if (!song.meta.artist) delete song.meta.artist;
      const k = fk.value.trim();
      if (k && P.parseKey(k)) song.meta.key = P.keyStr(P.parseKey(k));
      else if (!k && song.guessedKey) song.meta.key = song.guessedKey;
      if (!existing && !song.meta.x_added) song.meta.x_added = new Date().toISOString().slice(0, 10);
      const text = P.writeChordPro(song);
      const dest = path || store.uniquePath(P.songPath(song.meta));
      store.put(dest, text);
      const todo = store.todo();
      if (St.tickMatching(todo, song.meta.title)) { store.setTodo(todo); toast('Saved, and ticked off your to-add list.'); } else toast('Saved.');
      updateCounts();
      location.hash = '#/song/' + encodeURIComponent(dest);
      kickSync('save');
    });
    const del = $('#del');
    if (del) del.addEventListener('click', () => {
      if (!confirm('Delete \u201c' + (s0.meta.title || 'this song') + '\u201d? It stays in your repo history.')) return;
      store.remove(path); parsed.delete(path); toast('Deleted.'); location.hash = '#/'; kickSync('delete');
    });
    if (!existing) ta.focus();
  }

  // ---------- songs to add ----------
  let todoQuery = '';
  function viewTodo() {
    document.title = 'Songs to add \u00b7 Songbook';
    main.innerHTML = '<h1>Songs to add</h1><p class="sub small">Your wish list. The links open a normal web search in a new tab. Saving a song with the same title ticks it off.</p>' +
      '<form class="todoadd" id="tf"><input type="text" id="tt" placeholder="Title" aria-label="Title" autocomplete="off" required><input type="text" id="ta" placeholder="Artist" aria-label="Artist" autocomplete="off"><button class="btn" type="submit">Add</button></form>' +
      '<input type="search" id="tq" placeholder="Filter the list" aria-label="Filter the list" value="' + esc(todoQuery) + '">' +
      '<ul class="todos" id="todos"></ul>';
    function draw() {
      const todo = store.todo(); const nq = norm(todoQuery).trim();
      const rows = todo.items.map((it, i) => ({ it, i })).filter((r) => !nq || norm(r.it.title + ' ' + r.it.artist).includes(nq));
      rows.sort((a, b) => (a.it.done - b.it.done) || (a.i - b.i));
      $('#todos').innerHTML = rows.length ? rows.map(({ it, i }) => {
        const q = encodeURIComponent((it.title + ' ' + (it.artist || '')).trim());
        return '<li class="' + (it.done ? 'done' : '') + '"><input type="checkbox" data-i="' + i + '" id="td' + i + '" ' + (it.done ? 'checked' : '') + '>' +
          '<label for="td' + i + '"><span class="tt">' + esc(it.title) + '</span>' + (it.artist ? ' <span class="muted">' + esc(it.artist) + '</span>' : '') + '</label>' +
          '<button class="btn link del" data-del="' + i + '" aria-label="Remove ' + esc(it.title) + '">Remove</button>' +
          '<span class="links"><a href="https://www.google.com/search?q=' + q + '+chords" target="_blank" rel="noopener noreferrer">Search chords</a>' +
          '<a href="https://www.youtube.com/results?search_query=' + q + '" target="_blank" rel="noopener noreferrer">Search YouTube</a>' +
          (it.done ? '' : '<a href="#/new">Paste it</a>') + '</span></li>';
      }).join('') : '<li class="empty" style="display:block;border:none">' + (todo.items.length ? 'Nothing matches.' : 'The list is empty. Add a title above.') + '</li>';
    }
    draw();
    $('#tq').addEventListener('input', (e) => { todoQuery = e.target.value; draw(); });
    $('#tf').addEventListener('submit', (e) => {
      e.preventDefault();
      const t = $('#tt').value.trim(); if (!t) return;
      const todo = store.todo(); todo.items.push({ done: false, title: t, artist: $('#ta').value.trim() });
      store.setTodo(todo); $('#tt').value = ''; $('#ta').value = ''; draw(); updateCounts(); $('#tt').focus(); kickSync('todo');
    });
    $('#todos').addEventListener('change', (e) => {
      const i = e.target.dataset.i; if (i == null) return;
      const todo = store.todo(); todo.items[+i].done = e.target.checked; store.setTodo(todo); draw(); updateCounts(); kickSync('todo');
      const again = $('#td' + i); if (again) again.focus();
    });
    $('#todos').addEventListener('click', (e) => {
      const d = e.target.closest('[data-del]'); if (!d) return;
      const todo = store.todo(); todo.items.splice(+d.dataset.del, 1); store.setTodo(todo); draw(); updateCounts(); kickSync('todo');
    });
  }

  // ---------- sync setup (filled in by src/sync.js when present) ----------
  function viewSync() {
    document.title = 'Sync \u00b7 Songbook';
    const s = syncApi();
    if (s) return s.renderSetup(main);
    main.innerHTML = '<h1>Sync</h1><p class="sub">Songs are saved in this browser only.</p>';
  }

  window.songbookApp = { store, renderSong, songAt, toast, route };
  updateCounts();
  route();
  kickSync('open');
})();

</script>
